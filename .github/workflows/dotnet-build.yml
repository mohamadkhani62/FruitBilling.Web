name: .NET build and EF Core model validation

on:
  push:
    branches:
      - feature/multi-product-exit-permits
  pull_request:
    branches:
      - master
      - feature/multi-product-exit-permits

permissions:
  contents: write

# فقط آخرین Push هر شاخه باید Migration بسازد و آن را ثبت کند.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ github.run_id }}Ci!SqlAa
        ports:
          - 1433:1433
        options: >-
          --health-cmd "grep -q 'SQL Server is now ready for client connections' /var/opt/mssql/log/errorlog || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync feature branch to latest commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/multi-product-exit-permits'
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FruitBilling.Web.csproj

      - name: Build
        run: dotnet build FruitBilling.Web.csproj --configuration Release --no-restore

      - name: Install EF Core CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/multi-product-exit-permits'
        run: dotnet tool install --global dotnet-ef --version 10.0.15

      - name: Add global .NET tools to PATH
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/multi-product-exit-permits'
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate migration when the model has changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/multi-product-exit-permits'
        shell: bash
        run: |
          set -euo pipefail

          if dotnet-ef migrations has-pending-model-changes --project FruitBilling.Web.csproj; then
            echo "The EF Core model matches the current migration snapshot."
          else
            migration_name="SyncModel_${GITHUB_SHA:0:8}"
            echo "Pending EF Core model changes found. Generating ${migration_name}."
            dotnet-ef migrations add "${migration_name}" --project FruitBilling.Web.csproj --output-dir Migrations
          fi

      - name: Verify generated migration builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/multi-product-exit-permits'
        run: dotnet build FruitBilling.Web.csproj --configuration Release --no-restore

      - name: Apply migrations to disposable SQL Server
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/multi-product-exit-permits'
        env:
          ConnectionStrings__Default: "Server=localhost,1433;Database=FruitBillingCiDb;User Id=sa;Password=${{ github.run_id }}Ci!SqlAa;TrustServerCertificate=True;Encrypt=False"
        run: dotnet-ef database update --project FruitBilling.Web.csproj --context AppDbContext

      - name: Generate idempotent database SQL script
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/multi-product-exit-permits'
        run: |
          mkdir -p artifacts
          dotnet-ef migrations script --idempotent --project FruitBilling.Web.csproj --output artifacts/FruitBillingDb.sql

      - name: Upload database SQL script
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/multi-product-exit-permits'
        uses: actions/upload-artifact@v4
        with:
          name: FruitBillingDb-migration-script
          path: artifacts/FruitBillingDb.sql
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/multi-product-exit-permits'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Migrations
          if git diff --cached --quiet; then
            echo "No migration files were generated."
          else
            git commit -m "Add EF Core migration for current model"
            git push origin "${GITHUB_REF_NAME}"
          fi
